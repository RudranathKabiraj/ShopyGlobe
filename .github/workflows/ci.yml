name: ShoppyGlobe CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Frontend (React + Vite)
  # ─────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=50

      - name: Build frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 2: Backend (Node.js + Express)
  # ─────────────────────────────────────────
  backend:
    name: Backend Install & Start Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Check backend starts without error
        run: node --check server.js
        working-directory: backend